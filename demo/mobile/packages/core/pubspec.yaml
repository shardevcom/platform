name: shardev_core
description: Shared shell, API client and auth for the Shardev mobile client.
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.7.0
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  passkeys: ^2.23.1
  shared_preferences: ^2.3.3
  shardev_plugin_kit:
    path: ../plugin_kit

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
