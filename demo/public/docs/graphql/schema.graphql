type Product {
  id: ID!!
  sku: String!!
  name: String!!
  ean: String
  brand_id: Int
  active: Boolean!!
  brand: Brand @hasMany(relation: "brand", batch: true)
  created_at: DateTime!!
  updated_at: DateTime!!
}

type Brand {
  id: ID!!
  name: String!!
  created_at: DateTime!!
  updated_at: DateTime!!
}

type ProductConnection {
  data: [Product!!
  pagination: PaginationInfo!!
}

type PaginationInfo {
  total: Int!!
  count: Int!!
  per_page: Int!!
  current_page: Int!!
  last_page: Int!!
}

input FilterInput {
  field: String!!
  value: Mixed!!
}

input SortInput {
  field: String!!
  direction: SortDirection = asc
}

input CreateProductInput {
  sku: String!!
  name: String!!
  ean: String @rules(apply: ["nullable", "string", "max:32"])
  brand_id: Int @rules(apply: ["nullable", "integer", "min:1"])
  active: Boolean @rules(apply: ["boolean"])
}

input UpdateProductInput {
  sku: String @rules(apply: ["nullable", "string", "max:64"])
  name: String @rules(apply: ["nullable", "string", "max:255"])
  ean: String @rules(apply: ["nullable", "string", "max:32"])
  brand_id: Int @rules(apply: ["nullable", "integer", "min:1"])
  active: Boolean @rules(apply: ["boolean"])
}

type Query {
  filter: [FilterInput!!
  include: [String!!
  sort: [SortInput!!
  page: Int @rules(apply: ["min:1"])
  per_page: Int @rules(apply: ["min:1"])
  fields: [String!!
  id: ID!!
}

type Mutation {
  input: UpdateProductInput!!
  id: ID!!
}
